<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101313">
  <title>풍경 시계</title>
  <link rel="stylesheet" href="styles.css">
  <script src="clock.js" defer></script>
</head>
<body>
  <main class="screen" aria-label="풍경 시계">
    <div class="landscapes" aria-hidden="true">
      <img class="landscape is-current" src="photos/moraine-lake.webp" alt="" fetchpriority="high"
           data-place="Moraine Lake" data-name="모레인 호수" data-region="캐나다 · 밴프 국립공원" data-tone="twilight">
      <img class="landscape" src="photos/cabo-da-roca.webp" alt="" decoding="async"
           data-place="Cabo da Roca" data-name="로카곶" data-region="포르투갈" data-tone="daylight" style="--focus: 64% 50%">
      <img class="landscape" src="photos/sossusvlei.webp" alt="" decoding="async"
           data-place="Sossusvlei" data-name="소수스블레이" data-region="나미비아" data-tone="daylight">
      <img class="landscape" src="photos/memoir-notebook.webp" alt="" decoding="async"
           data-name="프로젝트 회고 작성 안내" data-review="project-review">
      <img class="landscape" src="photos/zurich.webp" alt="" decoding="async"
           data-place="Lake Zurich" data-name="취리히호의 아침" data-region="스위스" data-tone="daylight">
      <img class="landscape" src="photos/jeju.webp" alt="" decoding="async"
           data-place="Jeju Seongsan" data-name="성산의 해안" data-region="대한민국 · 제주" data-tone="daylight">
      <img class="landscape" src="photos/kirkjufell-aurora.webp" alt="" decoding="async"
           data-place="Kirkjufell" data-name="키르큐펠의 오로라" data-region="아이슬란드" data-tone="twilight">
      <img class="landscape" src="photos/redwoods.webp" alt="" decoding="async"
           data-place="Redwood Forest" data-name="레드우드 숲" data-region="미국 · 캘리포니아" data-tone="twilight">
      <img class="landscape" src="photos/review-workspace.webp" alt="" decoding="async"
           data-name="블로그 회고 발행 안내" data-review="blog-review">
    </div>

    <header class="toolbar">
      <button id="fullscreen" class="toolbar-button" type="button" hidden>
        <span class="fullscreen-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="fullscreen-label">전체 화면</span>
      </button>
      <button id="exit-kiosk" class="toolbar-button" type="button" title="종료 (Esc)" aria-keyshortcuts="Escape" hidden>종료</button>
      <p id="toolbar-status" class="toolbar-status" role="status"></p>
    </header>

    <div class="screen-content">
      <section class="clock" aria-label="현재 시각">
        <p id="clock-place" class="clock-place">Moraine Lake</p>
        <time id="clock-time" class="clock-time">
          <span id="hour-minute" class="clock-main">--:--</span><span class="visually-hidden">:</span><span id="second" class="clock-second">--</span>
        </time>
        <time id="calendar-date" class="clock-date"></time>
        <noscript><p>시각을 표시하려면 JavaScript를 켜 주세요.</p></noscript>
      </section>

      <section id="project-review" class="review-panel" aria-labelledby="project-review-heading" hidden>
        <h2 id="project-review-heading"></h2>
        <p id="project-review-intro"></p>
        <ul id="project-review-checklist" class="review-checklist"></ul>
      </section>

      <section id="blog-review" class="review-panel" aria-labelledby="blog-review-heading" hidden>
        <h2 id="blog-review-heading"></h2>
        <div class="review-post-title">
          <p id="review-title-label" class="review-title-label"></p>
          <p id="review-title-example" class="review-title-text" hidden></p>
          <p id="review-title-note"></p>
        </div>
        <dl id="review-publish-rules" class="review-publish-rules"></dl>
      </section>
    </div>

    <footer class="photo-bar">
      <div id="photo-location" class="location">
        <p id="photo-name" class="photo-name">모레인 호수</p>
        <p id="photo-region" class="photo-region">캐나다 · 밴프 국립공원</p>
      </div>
      <div id="photo-controls" class="photo-controls" role="group" aria-label="배경 사진" hidden>
        <div id="photo-steps" class="photo-steps" role="group" aria-label="사진 선택"></div>
        <button id="playback" class="playback" type="button" aria-label="사진 일시 정지" title="사진 일시 정지">
          <span class="playback-icon" aria-hidden="true"></span>
        </button>
      </div>
    </footer>
  </main>
</body>
</html>
